<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>GameKids - Animais</title>
  
  <!-- Configurações para PWA / Instalação na Tela Inicial -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fed6e3">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Fredoka', 'Chilanka', cursive, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: pan-y;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      position: relative;
    }

    .card-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 100%;
      max-height: 720px;
      background: #ffffff;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px;
      position: absolute;
      touch-action: none;
      cursor: grab;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 10px solid #fff;
    }

    .card:active {
      cursor: grabbing;
    }

    .image-frame {
      width: 100%;
      flex: 1;
      border-radius: 30px;
      overflow: hidden;
      background-color: #f7f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .item-name {
      font-size: 3.2rem;
      font-weight: 900;
      color: #2c3e50;
      margin: 15px 0 10px 0;
      text-transform: capitalize;
      letter-spacing: 1px;
      text-align: center;
    }

    .speak-button {
      background: linear-gradient(145deg, #FF6B6B, #FF8E53);
      color: white;
      border: none;
      border-radius: 60px;
      padding: 18px 60px;
      font-size: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
      cursor: pointer;
      outline: none;
    }

    .speak-button:active {
      transform: scale(0.92);
    }

    /* Botão flutuante discreto para forçar tela cheia */
    .fullscreen-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
    }

    /* Tela de carregamento inicial para garantir que as imagens já estão prontas */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #fed6e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #2c3e50;
      font-weight: bold;
      z-index: 999;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>

  <div id="loading-screen">Carregando Animais... 🐾</div>
  
  <button class="fullscreen-btn" id="fs-btn" title="Tela Cheia">⛶</button>

  <div class="game-container">
    <div class="card-viewport" id="viewport">
      <div class="card" id="card">
        <div class="image-frame">
          <img id="card-img" src="" alt="Item">
        </div>
        <div class="item-name" id="card-name">Item</div>
        
        <button class="speak-button" id="speak-btn" type="button">
          <span>🔊</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const items = [
      { name: 'Abelha', file: 'abelha.jpg' },
      { name: 'Arara', file: 'arara.jpg' },
      { name: 'Besouro', file: 'besouro.jpg' },
      { name: 'Cachorro', file: 'cachorro.jpg' },
      { name: 'Camelo', file: 'camelo.jpg' },
      { name: 'Canguru', file: 'canguru.jpg' },
      { name: 'Cavalo', file: 'cavalo.jpg' },
      { name: 'Coelho', file: 'coelho.jpg' },
      { name: 'Elefante', file: 'elefante.jpg' },
      { name: 'Formiga', file: 'formiga.jpg' },
      { name: 'Gaivota', file: 'gaivota.jpg' },
      { name: 'Galinha', file: 'galinha.jpg' },
      { name: 'Galo', file: 'galo.jpg' },
      { name: 'Gato', file: 'gato.jpg' },
      { name: 'Girafa', file: 'girafa.jpg' },
      { name: 'Gorila', file: 'gorila.jpg' },
      { name: 'Hipopótamo', file: 'hipopotamo.jpg' },
      { name: 'Jacaré', file: 'jacare.jpg' },
      { name: 'Joaninha', file: 'joaninha.jpg' },
      { name: 'Leão', file: 'leao.jpg' },
      { name: 'Macaco', file: 'macaco.jpg' },
      { name: 'Ovelha', file: 'ovelha.jpg' },
      { name: 'Papagaio', file: 'papagaio.jpg' },
      { name: 'Pato', file: 'pato.jpg' },
      { name: 'Pintinho', file: 'pintinho.jpg' },
      { name: 'Pombo', file: 'pombo.jpg' },
      { name: 'Porco', file: 'porco.jpg' },
      { name: 'Raposa', file: 'raposa.jpg' },
      { name: 'Rato', file: 'rato.jpg' },
      { name: 'Rinoceronte', file: 'rinoceronte.jpg' },
      { name: 'Sapo', file: 'sapo.jpg' },
      { name: 'Tartaruga', file: 'tartaruga.jpg' },
      { name: 'Tigre', file: 'tigre.jpg' },
      { name: 'Urso', file: 'urso.jpg' },
      { name: 'Vaca', file: 'vaca.jpg' },
      { name: 'Zebra', file: 'zebra.jpg' }
    ];

    let currentIndex = 0;
    const preloadedImages = {};
    const card = document.getElementById('card');
    const cardImg = document.getElementById('card-img');
    const cardName = document.getElementById('card-name');
    const speakBtn = document.getElementById('speak-btn');

    // Pré-carrega todas as imagens na memória para evitar qualquer delay ou travamento
    function preloadAllImages() {
      let loadedCount = 0;
      items.forEach(item => {
        const img = new Image();
        img.src = `imagens/${item.file}`;
        img.onload = () => {
          loadedCount++;
          if (loadedCount === items.length) {
            // Esconde a tela de carregamento quando tudo estiver pronto na memória
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').remove(), 400);
            renderCard(currentIndex);
          }
        };
        img.onerror = () => {
          loadedCount++; // Conta mesmo se der erro para não travar a tela
          if (loadedCount === items.length) {
            document.getElementById('loading-screen').remove();
            renderCard(currentIndex);
          }
        };
        preloadedImages[item.file] = img;
      });
    }

    function playPopSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function speakName(name) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(name);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderCard(index) {
      const item = items[index];
      cardImg.src = `imagens/${item.file}`;
      cardName.textContent = item.name;
    }

    speakBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      playPopSound();
      speakName(items[currentIndex].name);
    });

    // Botão de Tela Cheia Manual
    document.getElementById('fs-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Controle de Arrastar (Swipe)
    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function handleStart(e) {
      if (e.target.closest('#speak-btn') || e.target.closest('#fs-btn')) return;
      isDragging = true;
      startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      card.style.transition = 'none';
    }

    function handleMove(e) {
      if (!isDragging) return;
      currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      const diffX = currentX - startX;
      card.style.transform = `translateX(${diffX}px) rotate(${diffX * 0.04}deg)`;
    }

    function handleEnd() {
      if (!isDragging) return;
      isDragging = false;
      const diffX = currentX - startX;
      card.style.transition = 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

      if (diffX < -60 && currentIndex < items.length - 1) {
        currentIndex++;
        playPopSound();
        renderCard(currentIndex);
      } else if (diffX > 60 && currentIndex > 0) {
        currentIndex--;
        playPopSound();
        renderCard(currentIndex);
      }

      card.style.transform = 'translateX(0px) rotate(0deg)';
      startX = 0;
      currentX = 0;
    }

    card.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    card.addEventListener('touchstart', handleStart);
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleEnd);

    // Inicia o pré-carregamento ao abrir
    preloadAllImages();
  </script>
</body>
</html>
