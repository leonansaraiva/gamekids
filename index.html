<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>GameKids - Animais</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fed6e3">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="imagens/tubarao.jpg">
  <link rel="apple-touch-icon" href="imagens/tubarao.jpg">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka One', 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: fixed;
    }

    .game-container {
      width: 100%;
      max-width: 720px;
      height: 95vh;
      height: 95dvh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
    }

    /* Botão Avançar (Novo Estilo 3D Moderno e Divertido) */
    .nav-btn-next {
      background: linear-gradient(145deg, #2ecc71, #27ae60);
      border: 4px solid #ffffff;
      border-radius: 50%;
      width: 90px;
      height: 90px;
      font-size: 3rem;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 25px rgba(39, 174, 96, 0.45), inset 0 4px 6px rgba(255, 255, 255, 0.4);
      z-index: 10;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s, opacity 0.2s;
      outline: none;
      flex-shrink: 0;
      margin-left: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .nav-btn-next:hover {
      transform: scale(1.05);
      filter: brightness(1.05);
    }

    .nav-btn-next:active {
      transform: scale(0.92);
      box-shadow: 0 6px 15px rgba(39, 174, 96, 0.4), inset 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Estilo quando bloqueado */
    .nav-btn-next.locked {
      background: linear-gradient(145deg, #bdc3c7, #95a5a6);
      border-color: #ecf0f1;
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
      text-shadow: none;
    }

    .card-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: 1;
    }

    .card {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      max-height: 85dvh;
      background: #ffffff;
      border-radius: 35px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 22px;
      position: absolute;
      border: 8px solid #fff;
    }

    .image-frame {
      width: 100%;
      flex: 1;
      border-radius: 25px;
      overflow: hidden;
      background-color: #f7f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
      min-height: 0;
    }

    .image-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .item-name {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      color: #2d3748;
      margin: 10px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }

    /* Botão de Som (Novo Estilo Cápsula 3D Premium) */
    .speak-button {
      background: linear-gradient(145deg, #ff7675, #d63031);
      color: white;
      border: 4px solid #ffffff;
      border-radius: 50px;
      padding: 14px 45px;
      font-size: clamp(2rem, 4.5vw, 2.6rem);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(214, 48, 49, 0.4), inset 0 4px 6px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      outline: none;
      width: 85%;
      max-width: 340px;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .speak-button:hover {
      transform: scale(1.03);
      filter: brightness(1.05);
    }

    .speak-button:active {
      transform: scale(0.93);
      box-shadow: 0 5px 12px rgba(214, 48, 49, 0.4), inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .fullscreen-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #fed6e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #2c3e50;
      font-weight: bold;
      z-index: 999;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>

  <div id="loading-screen">Carregando Animais... 🐾</div>
  
  <button class="fullscreen-btn" id="fs-btn" title="Tela Cheia">⛶</button>

  <div class="game-container">
    <div class="card-viewport" id="viewport">
      <div class="card" id="card">
        <div class="image-frame">
          <img id="card-img" src="" alt="Item">
        </div>
        <div class="item-name" id="card-name">Item</div>
        
        <button class="speak-button" id="speak-btn" type="button">
          <span>🔊</span> <span>Ouvir</span>
        </button>
      </div>
    </div>

    <button class="nav-btn-next" id="next-btn" title="Próximo">▶</button>
  </div>

  <script>
    const items = [
      { name: 'Abelha', file: 'abelha.jpg' },
      { name: 'Arara', file: 'arara.jpg' },
      { name: 'Baleia', file: 'baleia.jpg' },
      { name: 'Besouro', file: 'besouro.jpg' },
      { name: 'Borboleta', file: 'borboleta.jpg' },
      { name: 'Cachorro', file: 'cachorro.jpg' },
      { name: 'Camelo', file: 'camelo.jpg' },
      { name: 'Canguru', file: 'canguru.jpg' },
      { name: 'Caranguejo', file: 'caranguejo.jpg' },
      { name: 'Cavalo', file: 'cavalo.jpg' },
      { name: 'Cavalo-marinho', file: 'cavalosmarinho.jpg' },
      { name: 'Cobra', file: 'cobra.jpg' },
      { name: 'Coelho', file: 'coelho.jpg' },
      { name: 'Elefante', file: 'elefante.jpg' },
      { name: 'Formiga', file: 'formiga.jpg' },
      { name: 'Gaivota', file: 'gaivota.jpg' },
      { name: 'Galinha', file: 'galinha.jpg' },
      { name: 'Galo', file: 'galo.jpg' },
      { name: 'Gato', file: 'gato.jpg' },
      { name: 'Girafa', file: 'girafa.jpg' },
      { name: 'Golfinho', file: 'golfinho.jpg' },
      { name: 'Gorila', file: 'gorila.jpg' },
      { name: 'Hipopótamo', file: 'hipopotamo.jpg' },
      { name: 'Jacaré', file: 'jacare.jpg' },
      { name: 'Joaninha', file: 'joaninha.jpg' },
      { name: 'Leão', file: 'leao.jpg' },
      { name: 'Lula', file: 'lula.jpg' },
      { name: 'Macaco', file: 'macaco.jpg' },
      { name: 'Mosca', file: 'mosca.jpg' },
      { name: 'Ovelha', file: 'ovelha.jpg' },
      { name: 'Panda', file: 'panda.jpg' },
      { name: 'Papagaio', file: 'papagaio.jpg' },
      { name: 'Pato', file: 'pato.jpg' },
      { name: 'Pavão', file: 'pavao.jpg' },
      { name: 'Pintinho', file: 'pintinho.jpg' },
      { name: 'Polvo', file: 'polvo.jpg' },
      { name: 'Pombo', file: 'pombo.jpg' },
      { name: 'Porco', file: 'porco.jpg' },
      { name: 'Raposa', file: 'raposa.jpg' },
      { name: 'Rato', file: 'rato.jpg' },
      { name: 'Rinoceronte', file: 'rinoceronte.jpg' },
      { name: 'Sapo', file: 'sapo.jpg' },
      { name: 'Sereia', file: 'sereia.jpg' },
      { name: 'Tamanduá', file: 'tamandua.jpg' },
      { name: 'Tartaruga', file: 'tartaruga.jpg' },
      { name: 'Tigre', file: 'tigre.jpg' },
      { name: 'Tubarão', file: 'tubarao.jpg' },
      { name: 'Tucano', file: 'tucano.jpg' },
      { name: 'Urso', file: 'urso.jpg' },
      { name: 'Vaca', file: 'vaca.jpg' },
      { name: 'Zebra', file: 'zebra.jpg' }
    ];

    let currentIndex = 0;
    let isTransitioning = false;
    let canAdvance = false;
    
    const cardImg = document.getElementById('card-img');
    const cardName = document.getElementById('card-name');
    const speakBtn = document.getElementById('speak-btn');
    const nextBtn = document.getElementById('next-btn');

    function updateNextButtonState() {
      if (canAdvance) {
        nextBtn.classList.remove('locked');
      } else {
        nextBtn.classList.add('locked');
      }
    }

    function preloadAllImages() {
      let loadedCount = 0;
      const total = items.length;

      function checkFinished() {
        loadedCount++;
        if (loadedCount === total) {
          const screen = document.getElementById('loading-screen');
          if (screen) {
            screen.style.opacity = '0';
            setTimeout(() => screen.remove(), 400);
          }
          renderCard(currentIndex);
        }
      }

      items.forEach(item => {
        const img = new Image();
        img.src = `imagens/${item.file}`;
        img.onload = checkFinished;
        img.onerror = checkFinished;
      });
    }

    function playPopSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function speakName(name) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(name);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderCard(index) {
      const item = items[index];
      cardImg.src = `imagens/${item.file}`;
      cardName.textContent = item.name;
      updateNextButtonState();
    }

    function proximoAnimal() {
      if (isTransitioning) return;
      if (!canAdvance) return;

      currentIndex = (currentIndex + 1) % items.length;
      
      isTransitioning = true;
      renderCard(currentIndex);
      
      canAdvance = false;
      updateNextButtonState();

      setTimeout(() => { isTransitioning = false; }, 150);
    }

    nextBtn.addEventListener('click', proximoAnimal);

    speakBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      playPopSound(); 
      speakName(items[currentIndex].name);

      canAdvance = true;
      updateNextButtonState();
    });

    document.getElementById('fs-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    preloadAllImages();
  </script>
</body>
</html>
