<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sons e Nomes dos Animais</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para ícones divertidos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Fredoka (Fonte arredondada e infantil) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animações e efeitos dos cards */
        .card-bounce {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-pulse {
            animation: pulse-light 2s infinite;
        }

        @keyframes pulse-light {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .speech-active {
            animation: bounce-speaking 0.5s infinite alternate;
        }

        @keyframes bounce-speaking {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Ocultar barra de rolagem */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-300 via-indigo-200 to-purple-300 min-h-screen flex flex-col justify-between items-center p-3 md:p-6 overflow-x-hidden select-none">

    <!-- Cabeçalho -->
    <header class="w-full max-w-2xl text-center py-2 flex justify-between items-center px-4">
        <div class="flex items-center gap-2">
            <span class="text-3xl md:text-4xl">🐾</span>
            <h1 class="text-2xl md:text-4xl font-bold text-indigo-900 tracking-wide drop-shadow-md">
                Mundo Animal
            </h1>
        </div>
        <button id="toggle-auto-speak" class="bg-white/80 backdrop-blur text-indigo-800 font-semibold px-3 py-1.5 rounded-full shadow text-xs md:text-sm flex items-center gap-2 hover:bg-white transition">
            <i class="fas fa-volume-up text-indigo-600"></i>
            <span id="auto-speak-status">Fala ao Mudar: SIM</span>
        </button>
    </header>

    <!-- Conteúdo Principal - Card Central -->
    <main class="w-full max-w-md my-auto flex flex-col items-center justify-center">
        
        <!-- Área do Card Interativo -->
        <div id="card-container" class="w-full relative touch-pan-x">
            
            <div id="animal-card" class="card-bounce bg-white rounded-3xl p-6 shadow-2xl border-4 border-white flex flex-col items-center text-center relative overflow-hidden min-h-[380px] justify-between">
                
                <!-- Indicador de Posição/Total -->
                <span id="card-counter" class="absolute top-4 right-4 bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full text-sm">
                    1 / 15
                </span>

                <!-- Ilustração do Animal -->
                <div id="animal-avatar-container" class="w-48 h-48 md:w-56 md:h-56 my-2 rounded-2xl flex items-center justify-center bg-gradient-to-b transition-all duration-300 transform">
                    <span id="animal-emoji" class="text-8xl md:text-9xl filter drop-shadow-lg transition-transform duration-300">
                        🐔
                    </span>
                </div>

                <!-- Nome do Animal em Destaque -->
                <div class="w-full">
                    <h2 id="animal-name" class="text-4xl md:text-5xl font-black text-slate-800 tracking-wider mb-4 uppercase drop-shadow-sm">
                        GALINHA
                    </h2>

                    <!-- Botão de Ouvir o Nome -->
                    <button id="btn-speak" class="btn-pulse w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 text-xl md:text-2xl transition duration-150 border-b-4 border-emerald-700">
                        <i class="fas fa-volume-high text-2xl md:text-3xl"></i>
                        <span>OUVIR NOME</span>
                    </button>
                </div>

            </div>

        </div>

        <!-- Botões Grandes de Navegação (Anterior / Próximo) -->
        <div class="w-full flex justify-between items-center gap-4 mt-6">
            <button id="btn-prev" class="flex-1 bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-bold py-4 px-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-xl md:text-2xl border-b-4 border-amber-600 transition">
                <i class="fas fa-arrow-left"></i>
                <span>ANTERIOR</span>
            </button>

            <button id="btn-next" class="flex-1 bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-bold py-4 px-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-xl md:text-2xl border-b-4 border-sky-700 transition">
                <span>PRÓXIMO</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>

    </main>

    <!-- Miniaturas Rápidas no Rodapé -->
    <footer class="w-full max-w-2xl mt-4">
        <div id="thumbnails-container" class="flex gap-2 overflow-x-auto no-scrollbar py-2 px-2">
            <!-- As miniaturas serão inseridas via JavaScript -->
        </div>
    </footer>

    <script>
        /* Lista de Animais com nomes, emojis e cores de fundo */
        const animals = [
            { id: 'galinha', name: 'GALINHA', emoji: '🐔', bg: 'from-amber-100 to-amber-200' },
            { id: 'jacare', name: 'JACARÉ', emoji: '🐊', bg: 'from-emerald-100 to-emerald-200' },
            { id: 'cachorro', name: 'CACHORRO', emoji: '🐶', bg: 'from-orange-100 to-orange-200' },
            { id: 'gato', name: 'GATO', emoji: '🐱', bg: 'from-yellow-100 to-yellow-200' },
            { id: 'cobra', name: 'COBRA', emoji: '🐍', bg: 'from-green-100 to-green-200' },
            { id: 'coelho', name: 'COELHO', emoji: '🐰', bg: 'from-pink-100 to-pink-200' },
            { id: 'ovelha', name: 'OVELHA', emoji: '🐑', bg: 'from-slate-100 to-slate-200' },
            { id: 'passarinho', name: 'PASSARINHO', emoji: '🐦', bg: 'from-sky-100 to-sky-200' },
            { id: 'abelha', name: 'ABELHA', emoji: '🐝', bg: 'from-amber-200 to-yellow-300' },
            { id: 'tatu', name: 'TATU', emoji: '🦔', bg: 'from-stone-100 to-stone-200' },
            { id: 'elefante', name: 'ELEFANTE', emoji: '🐘', bg: 'from-blue-100 to-blue-200' },
            { id: 'girafa', name: 'GIRAFA', emoji: '🦒', bg: 'from-amber-100 to-orange-200' },
            { id: 'leao', name: 'LEÃO', emoji: '🦁', bg: 'from-orange-200 to-amber-300' },
            { id: 'macaco', name: 'MACACO', emoji: '🐒', bg: 'from-amber-200 to-stone-300' },
            { id: 'pato', name: 'PATO', emoji: '🦆', bg: 'from-teal-100 to-teal-200' }
        ];

        let currentIndex = 0;
        let autoSpeak = true;

        // Elementos da Interface
        const cardElement = document.getElementById('animal-card');
        const emojiElement = document.getElementById('animal-emoji');
        const avatarContainer = document.getElementById('animal-avatar-container');
        const nameElement = document.getElementById('animal-name');
        const counterElement = document.getElementById('card-counter');
        const btnSpeak = document.getElementById('btn-speak');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const thumbnailsContainer = document.getElementById('thumbnails-container');
        const btnToggleAutoSpeak = document.getElementById('toggle-auto-speak');
        const autoSpeakStatus = document.getElementById('auto-speak-status');

        // Função para Falar o Nome do Animal (Web Speech API)
        function speakName(text) {
            if ('speechSynthesis' in window) {
                // Cancela falas anteriores pendentes
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.85; // Velocidade um pouco mais pausada para crianças
                utterance.pitch = 1.1;  // Tom levemente mais agudo/amigável

                // Efeito visual enquanto fala
                utterance.onstart = () => {
                    avatarContainer.classList.add('speech-active');
                    btnSpeak.classList.add('bg-emerald-600');
                };

                utterance.onend = () => {
                    avatarContainer.classList.remove('speech-active');
                    btnSpeak.classList.remove('bg-emerald-600');
                };

                utterance.onerror = () => {
                    avatarContainer.classList.remove('speech-active');
                    btnSpeak.classList.remove('bg-emerald-600');
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function updateCard(index) {
            const animal = animals[index];

            // Animação leve ao trocar de card
            cardElement.style.transform = 'scale(0.95)';
            setTimeout(() => {
                cardElement.style.transform = 'scale(1)';
            }, 150);

            // Atualiza dados na tela
            emojiElement.textContent = animal.emoji;
            nameElement.textContent = animal.name;
            counterElement.textContent = `${index + 1} / ${animals.length}`;

            // Atualiza classe de gradiente de fundo do avatar
            avatarContainer.className = `w-48 h-48 md:w-56 md:h-56 my-2 rounded-2xl flex items-center justify-center bg-gradient-to-b ${animal.bg} transition-all duration-300 transform shadow-inner`;

            // Atualiza destaque na lista de miniaturas
            updateThumbnails();

            // Fala o nome se a opção estiver ativada
            if (autoSpeak) {
                speakName(animal.name);
            }
        }

        function renderThumbnails() {
            thumbnailsContainer.innerHTML = '';
            animals.forEach((animal, index) => {
                const thumb = document.createElement('button');
                thumb.className = `flex-shrink-0 w-14 h-14 md:w-16 md:h-16 rounded-2xl text-2xl md:text-3xl flex items-center justify-center transition shadow-md ${
                    index === currentIndex ? 'bg-white border-4 border-indigo-500 scale-110' : 'bg-white/70 opacity-80'
                }`;
                thumb.innerHTML = animal.emoji;
                thumb.onclick = () => {
                    currentIndex = index;
                    updateCard(currentIndex);
                };
                thumbnailsContainer.appendChild(thumb);
            });
        }

        function updateThumbnails() {
            const buttons = thumbnailsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                if (i === currentIndex) {
                    buttons[i].className = 'flex-shrink-0 w-14 h-14 md:w-16 md:h-16 rounded-2xl text-2xl md:text-3xl flex items-center justify-center transition shadow-md bg-white border-4 border-indigo-500 scale-110';
                    buttons[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    buttons[i].className = 'flex-shrink-0 w-14 h-14 md:w-16 md:h-16 rounded-2xl text-2xl md:text-3xl flex items-center justify-center transition shadow-md bg-white/70 opacity-80';
                }
            }
        }

        // Suporte para Swipe / Deslizar no Tablet
        let touchStartX = 0;
        let touchEndX = 0;

        const cardContainer = document.getElementById('card-container');

        cardContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        cardContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50; // distância mínima para considerar swipe
            if (touchEndX < touchStartX - swipeThreshold) {
                // Deslizou para a esquerda -> Próximo
                nextAnimal();
            } else if (touchEndX > touchStartX + swipeThreshold) {
                // Deslizou para a direita -> Anterior
                prevAnimal();
            }
        }

        // Navegação
        function nextAnimal() {
            currentIndex = (currentIndex + 1) % animals.length;
            updateCard(currentIndex);
        }

        function prevAnimal() {
            currentIndex = (currentIndex - 1 + animals.length) % animals.length;
            updateCard(currentIndex);
        }

        btnNext.addEventListener('click', nextAnimal);
        btnPrev.addEventListener('click', prevAnimal);
        btnSpeak.addEventListener('click', () => {
            speakName(animals[currentIndex].name);
        });

        // Toggle Auto-Fala
        btnToggleAutoSpeak.addEventListener('click', () => {
            autoSpeak = !autoSpeak;
            autoSpeakStatus.textContent = `Fala ao Mudar: ${autoSpeak ? 'SIM' : 'NÃO'}`;
        });

        // Suporte a setas do teclado (para testes no computador)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextAnimal();
            if (e.key === 'ArrowLeft') prevAnimal();
            if (e.key === ' ' || e.key === 'Enter') speakName(animals[currentIndex].name);
        });

        // Inicialização do aplicativo
        window.onload = () => {
            renderThumbnails();
            // Primeira renderização
            updateCard(currentIndex);
        };
    </script>
</body>
</html>
