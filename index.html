<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cards Infantis</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Fredoka', cursive, sans-serif;
    touch-action: manipulation;
    overflow: hidden;
    background: linear-gradient(135deg, #a855f7 0%, #3b82f6 50%, #06b6d4 100%);
  }
  .card-shadow {
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.25), 0 0 0 8px rgba(255,255,255,.8);
  }
  .btn-bounce { transition: transform .1s ease, box-shadow .1s ease; }
  .btn-bounce:active { transform: scale(.92) !important; }

  @keyframes sound-wave {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.05) rotate(1deg); }
    100% { transform: scale(1); }
  }
  .anim-playing { animation: sound-wave .3s ease-in-out infinite; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Área de arraste: NÃO deixa o navegador capturar o gesto */
  #card-stage { touch-action: none; }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-2 sm:p-4 select-none">

<main class="w-full max-w-lg my-auto flex flex-col items-center relative">

  <!-- Stage do Card (Arrastável) -->
  <div id="card-stage" class="w-full relative touch-none cursor-grab active:cursor-grabbing px-2 py-1">

    <div id="item-card" class="card-shadow bg-white rounded-3xl p-4 sm:p-6 flex flex-col items-center justify-between min-h-[460px] sm:min-h-[520px] transition-transform duration-100 ease-out relative will-change-transform">

      <div class="w-full flex justify-end items-center px-1">
        <span id="card-counter" class="bg-amber-100 text-amber-900 font-extrabold px-3 py-1 rounded-full text-xs sm:text-sm">1 / 16</span>
      </div>

      <div class="w-full grid grid-cols-2 gap-3 my-2 items-center justify-center">
        <div class="flex flex-col items-center justify-center bg-amber-50 rounded-2xl p-3 border-2 border-amber-200 h-36 sm:h-44 shadow-inner">
          <span id="item-emoji" class="text-6xl sm:text-7xl drop-shadow-md">🐶</span>
          <span class="text-xs font-bold text-amber-800/60 uppercase mt-1">Desenho</span>
        </div>

        <div class="relative bg-slate-100 rounded-2xl overflow-hidden border-2 border-slate-200 h-36 sm:h-44 shadow-inner flex items-center justify-center">
          <img id="item-photo" src="" alt="Foto Real"
               class="w-full h-full object-cover transition-opacity duration-300"
               onerror="this.src='https://placehold.co/400x400/3b82f6/ffffff?text=Carregando...'"/>
          <span class="absolute bottom-1 right-2 text-[10px] font-bold text-white bg-black/50 px-2 py-0.5 rounded-full uppercase backdrop-blur-sm">Foto Real</span>
        </div>
      </div>

      <h2 id="item-name" class="text-3xl sm:text-5xl font-black text-slate-800 tracking-wider my-2 uppercase text-center">CACHORRO</h2>

      <div class="w-full grid grid-cols-2 gap-3 sm:gap-4 mt-2">
        <button id="btn-speak" class="btn-bounce bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-extrabold py-3 sm:py-4 px-2 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-1 border-b-4 border-emerald-700">
          <i class="fas fa-comment-dots text-3xl sm:text-4xl"></i>
          <span class="text-sm sm:text-base tracking-wide uppercase">NOME</span>
        </button>

        <button id="btn-sound" class="btn-bounce bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-extrabold py-3 sm:py-4 px-2 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-1 border-b-4 border-amber-700">
          <i class="fas fa-volume-high text-3xl sm:text-4xl"></i>
          <span class="text-sm sm:text-base tracking-wide uppercase">SOM</span>
        </button>
      </div>

    </div>
  </div>

  <div class="w-full flex justify-between items-center gap-4 mt-3 px-2">
    <button id="btn-prev" class="btn-bounce flex-1 bg-white/90 hover:bg-white text-indigo-900 font-extrabold py-3 sm:py-4 rounded-2xl shadow-xl flex items-center justify-center gap-2 text-lg sm:text-xl border-b-4 border-slate-300">
      <i class="fas fa-chevron-left text-2xl"></i>
      <span>ANTERIOR</span>
    </button>

    <button id="btn-next" class="btn-bounce flex-1 bg-amber-400 hover:bg-amber-300 text-amber-950 font-extrabold py-3 sm:py-4 rounded-2xl shadow-xl flex items-center justify-center gap-2 text-lg sm:text-xl border-b-4 border-amber-600">
      <span>PRÓXIMO</span>
      <i class="fas fa-chevron-right text-2xl"></i>
    </button>
  </div>
</main>

<footer class="w-full max-w-lg mt-2">
  <div id="thumbnails-bar" class="flex gap-2 overflow-x-auto no-scrollbar py-2 px-3 bg-white/30 backdrop-blur-md rounded-2xl border border-white/40"></div>
</footer>

<script>
/* =========================================================
   BASE DE DADOS
   - photo: Unsplash (foto real)
   - audio: som real do animal (Wikimedia Commons / gratuitos)
   - fallback: tipo de som sintetizado caso o áudio falhe
   ========================================================= */
const database = [
  {
    id:'cachorro', name:'Cachorro', emoji:'🐶',
    photo:'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/2/2f/Dog_barking.ogg',
    fallback:'bark'
  },
  {
    id:'gato', name:'Gato', emoji:'🐱',
    photo:'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/1/1a/Cat_meow.ogg',
    fallback:'meow'
  },
  {
    id:'galinha', name:'Galinha', emoji:'🐔',
    photo:'https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/6/6b/Chicken_clucking.ogg',
    fallback:'cluck'
  },
  {
    id:'pintinho', name:'Pintinho', emoji:'🐤',
    photo:'https://images.unsplash.com/photo-1598965402089-897ce52e8355?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/0/0a/Chick_chirp.ogg',
    fallback:'peep'
  },
  {
    id:'vaca', name:'Vaca', emoji:'🐮',
    photo:'https://images.unsplash.com/photo-1570042225831-d98fa7577f1e?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/8/80/Cow_moo.ogg',
    fallback:'moo'
  },
  {
    id:'porco', name:'Porco', emoji:'🐷',
    photo:'https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/9/9b/Pig_grunt.ogg',
    fallback:'oink'
  },
  {
    id:'ovelha', name:'Ovelha', emoji:'🐑',
    photo:'https://images.unsplash.com/photo-1484557052118-f32bd25b45b5?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/7/7c/Sheep_bleat.ogg',
    fallback:'baa'
  },
  {
    id:'pato', name:'Pato', emoji:'🦆',
    photo:'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/3/3a/Duck_quack.ogg',
    fallback:'quack'
  },
  {
    id:'leao', name:'Leão', emoji:'🦁',
    photo:'https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/1/1c/Lion_roar.ogg',
    fallback:'roar'
  },
  {
    id:'elefante', name:'Elefante', emoji:'🐘',
    photo:'https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/5/5c/Elephant_trumpet.ogg',
    fallback:'trumpet'
  },
  {
    id:'macaco', name:'Macaco', emoji:'🐵',
    photo:'https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/9/9b/Monkey_sound.ogg',
    fallback:'monkey'
  },
  {
    id:'sapo', name:'Sapo', emoji:'🐸',
    photo:'https://images.unsplash.com/photo-1559253664-ca249d4608c6?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/6/6e/Frog_croak.ogg',
    fallback:'croak'
  },
  {
    id:'passaro', name:'Pássaro', emoji:'🐦',
    photo:'https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/4/4b/Bird_song.ogg',
    fallback:'tweet'
  },
  {
    id:'abelha', name:'Abelha', emoji:'🐝',
    photo:'https://images.unsplash.com/photo-1558642452-9d2a7deb7f62?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/6/6b/Bee_buzz.ogg',
    fallback:'buzz'
  },
  {
    id:'carro', name:'Carro', emoji:'🚗',
    photo:'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/9/9d/Car_horn.ogg',
    fallback:'honk'
  },
  {
    id:'trem', name:'Trem', emoji:'🚂',
    photo:'https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&w=500&q=80',
    audio:'https://upload.wikimedia.org/wikipedia/commons/1/1c/Train_whistle.ogg',
    fallback:'train'
  }
];

/* =========================================================
   ELEMENTOS
   ========================================================= */
let currentIndex = 0;

const stage        = document.getElementById('card-stage');
const card         = document.getElementById('item-card');
const itemEmoji    = document.getElementById('item-emoji');
const itemPhoto    = document.getElementById('item-photo');
const itemName     = document.getElementById('item-name');
const cardCounter  = document.getElementById('card-counter');
const thumbnailsBar= document.getElementById('thumbnails-bar');

const btnSpeak = document.getElementById('btn-speak');
const btnSound = document.getElementById('btn-sound');
const btnPrev  = document.getElementById('btn-prev');
const btnNext  = document.getElementById('btn-next');

/* =========================================================
   ÁUDIO REAL (com fallback sintetizado)
   ========================================================= */
let currentAudio = null;

function playRealSound(item) {
  // para qualquer áudio em andamento
  if (currentAudio) {
    try { currentAudio.pause(); } catch(e) {}
    currentAudio = null;
  }

  const audio = new Audio(item.audio);
  audio.preload = 'auto';
  audio.volume = 0.9;
  currentAudio = audio;

  audio.addEventListener('error', () => {
    console.warn('Falha ao tocar som real, usando fallback:', item.id);
    playFallbackSound(item.fallback);
  }, { once:true });

  audio.play().catch(err => {
    console.warn('Autoplay bloqueado, tentando fallback:', err);
    playFallbackSound(item.fallback);
  });

  card.classList.add('anim-playing');
  audio.addEventListener('ended', () => card.classList.remove('anim-playing'), { once:true });
}

/* Fallback simples (síntese) — só se o áudio real falhar */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playFallbackSound(type) {
  const ctx = getAudioContext();
  const now = ctx.currentTime;

  const makeTone = (freq, dur, type='sine', vol=0.3, delay=0) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now + delay);
    gain.gain.setValueAtTime(vol, now + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now + delay); osc.stop(now + delay + dur);
  };

  if (type === 'bark')      { makeTone(160,0.15,'sawtooth',0.4,0);   makeTone(160,0.15,'sawtooth',0.4,0.22); }
  else if (type === 'meow') { makeTone(600,0.5,'sine',0.3,0); }
  else if (type === 'moo')  { makeTone(110,0.9,'sawtooth',0.35,0); }
  else if (type === 'cluck'){ makeTone(320,0.1,'triangle',0.3,0); makeTone(320,0.1,'triangle',0.3,0.15); }
  else if (type === 'peep') { makeTone(2400,0.1,'sine',0.25,0); makeTone(2400,0.1,'sine',0.25,0.2); }
  else if (type === 'quack'){ makeTone(280,0.25,'sawtooth',0.3,0); }
  else if (type === 'roar') { makeTone(90,0.8,'sawtooth',0.4,0); }
  else if (type === 'honk') { makeTone(420,0.15,'square',0.2,0); makeTone(420,0.15,'square',0.2,0.2); }
  else if (type === 'train'){ makeTone(523,0.7,'sine',0.25,0); makeTone(659,0.7,'sine',0.25,0); }
  else                       { makeTone(440,0.25,'sine',0.3,0); }
}

/* =========================================================
   FALA DO NOME
   ========================================================= */
function speakItemName(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'pt-BR';
  utter.rate = 0.85;
  utter.pitch = 1.15;
  card.classList.add('anim-playing');
  utter.onend   = () => card.classList.remove('anim-playing');
  utter.onerror = () => card.classList.remove('anim-playing');
  window.speechSynthesis.speak(utter);
}

/* =========================================================
   RENDER
   ========================================================= */
function renderCard() {
  const item = database[currentIndex];
  itemEmoji.textContent = item.emoji;
  itemPhoto.src = item.photo;
  itemName.textContent = item.name;
  cardCounter.textContent = `${currentIndex + 1} / ${database.length}`;

  // pré-carrega o áudio do próximo card para tocar mais rápido
  const next = database[(currentIndex + 1) % database.length];
  if (next && next.audio) { const a = new Audio(next.audio); a.preload = 'auto'; }

  updateThumbnails();
  // fala o nome automaticamente (pode ser bloqueado até o primeiro toque)
  speakItemName(item.name);
}

function updateThumbnails() {
  thumbnailsBar.innerHTML = '';
  database.forEach((item, index) => {
    const btn = document.createElement('button');
    btn.className = `flex-shrink-0 w-12 h-12 rounded-xl text-2xl flex items-center justify-center transition-all ${
      index === currentIndex ? 'bg-amber-400 scale-110 shadow-lg border-2 border-white' : 'bg-white/70 opacity-70'
    }`;
    btn.textContent = item.emoji;
    btn.onclick = () => { currentIndex = index; renderCard(); };
    thumbnailsBar.appendChild(btn);
  });
  const active = thumbnailsBar.children[currentIndex];
  if (active) active.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
function nextCard() {
  card.style.transform = 'translateX(-100%) rotate(-8deg)';
  setTimeout(() => {
    currentIndex = (currentIndex + 1) % database.length;
    card.style.transition = 'none';
    card.style.transform = 'translateX(100%) rotate(8deg)';
    renderCard();
    setTimeout(() => {
      card.style.transition = 'transform .25s ease-out';
      card.style.transform = 'translateX(0) rotate(0)';
    }, 20);
  }, 180);
}

function prevCard() {
  card.style.transform = 'translateX(100%) rotate(8deg)';
  setTimeout(() => {
    currentIndex = (currentIndex - 1 + database.length) % database.length;
    card.style.transition = 'none';
    card.style.transform = 'translateX(-100%) rotate(-8deg)';
    renderCard();
    setTimeout(() => {
      card.style.transition = 'transform .25s ease-out';
      card.style.transform = 'translateX(0) rotate(0)';
    }, 20);
  }, 180);
}

/* =========================================================
   ARRASTE (Pointer Events — funciona em tablet, mouse e toque)
   ========================================================= */
let startX = 0, currentX = 0, isDragging = false, pointerId = null;

function onPointerDown(e) {
  // só inicia o arraste se for o card/stage (não os botões)
  if (e.target.closest('button')) return;
  isDragging = true;
  pointerId = e.pointerId;
  startX = e.clientX;
  currentX = 0;
  card.style.transition = 'none';
  stage.setPointerCapture?.(e.pointerId);
}

function onPointerMove(e) {
  if (!isDragging || e.pointerId !== pointerId) return;
  currentX = e.clientX - startX;
  card.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.04}deg)`;
}

function onPointerUp(e) {
  if (!isDragging || (pointerId !== null && e.pointerId !== pointerId)) return;
  isDragging = false;
  pointerId = null;
  card.style.transition = 'transform .25s ease-out';

  const threshold = 70;
  if (currentX < -threshold)      nextCard();
  else if (currentX > threshold)  prevCard();
  else                            card.style.transform = 'translateX(0) rotate(0)';
  currentX = 0;
}

stage.addEventListener('pointerdown', onPointerDown);
stage.addEventListener('pointermove', onPointerMove);
stage.addEventListener('pointerup', onPointerUp);
stage.addEventListener('pointercancel', onPointerUp);
stage.addEventListener('pointerleave', onPointerUp);

/* Bloqueia gestos de scroll/zoom da página no stage (tablet) */
stage.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
stage.addEventListener('gesturestart', e => e.preventDefault());

/* =========================================================
   BOTÕES
   ========================================================= */
btnNext.addEventListener('click', nextCard);
btnPrev.addEventListener('click', prevCard);

btnSpeak.addEventListener('click', () => {
  speakItemName(database[currentIndex].name);
});

btnSound.addEventListener('click', () => {
  playRealSound(database[currentIndex]);
});

/* Teclado (desktop) */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft')  prevCard();
  if (e.key === ' ')          { e.preventDefault(); speakItemName(database[currentIndex].name); }
});

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
window.addEventListener('load', () => {
  renderCard();

  // Desbloqueia o áudio no primeiro toque (política de autoplay dos tablets)
  const unlock = () => {
    try {
      const a = new Audio();
      a.play().catch(()=>{});
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e){}
    document.removeEventListener('pointerdown', unlock);
  };
  document.addEventListener('pointerdown', unlock, { once:true });
});
</script>
</body>
</html>
