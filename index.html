<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>GameKids - Animais</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fed6e3">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="imagens/tubarao.jpg">
  <link rel="apple-touch-icon" href="imagens/tubarao.jpg">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka One', 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 650px;
      height: 92vh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 50%;
      width: 65px;
      height: 65px;
      font-size: 2.2rem;
      color: #2c3e50;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      z-index: 10;
      transition: transform 0.1s, background 0.2s;
      outline: none;
      flex-shrink: 0;
    }

    .nav-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 1);
    }

    .card-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 0 15px;
    }

    .card {
      width: 100%;
      height: 100%;
      max-height: 720px;
      background: #ffffff;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 25px;
      position: absolute;
      border: 10px solid #fff;
    }

    .image-frame {
      width: 100%;
      flex: 1;
      border-radius: 30px;
      overflow: hidden;
      background-color: #f7f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .item-name {
      font-size: 3.2rem;
      font-weight: 800;
      color: #2d3748;
      margin: 15px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }

    .speak-button {
      background: linear-gradient(145deg, #FF6B6B, #FF8E53);
      color: white;
      border: none;
      border-radius: 60px;
      padding: 16px 50px;
      font-size: 2.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
      cursor: pointer;
      outline: none;
    }

    .speak-button:active {
      transform: scale(0.92);
    }

    .fullscreen-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #fed6e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #2c3e50;
      font-weight: bold;
      z-index: 999;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>

  <div id="loading-screen">Carregando Animais... 🐾</div>
  
  <button class="fullscreen-btn" id="fs-btn" title="Tela Cheia">⛶</button>

  <div class="game-container">
    <button class="nav-btn" id="prev-btn" title="Anterior">◀</button>

    <div class="card-viewport" id="viewport">
      <div class="card" id="card">
        <div class="image-frame">
          <img id="card-img" src="" alt="Item">
        </div>
        <div class="item-name" id="card-name">Item</div>
        
        <button class="speak-button" id="speak-btn" type="button">
          <span>🔊</span>
        </button>
      </div>
    </div>

    <button class="nav-btn" id="next-btn" title="Próximo">▶</button>
  </div>

  <script>
   const items = [
      { name: 'Abelha', file: 'abelha.jpg' },
      { name: 'Arara', file: 'arara.jpg' },
      { name: 'Baleia', file: 'baleia.jpg' },
      { name: 'Besouro', file: 'besouro.jpg' },
      { name: 'Borboleta', file: 'borboleta.jpg' },
      { name: 'Cachorro', file: 'cachorro.jpg' },
      { name: 'Camelo', file: 'camelo.jpg' },
      { name: 'Canguru', file: 'canguru.jpg' },
      { name: 'Caranguejo', file: 'caranguejo.jpg' },
      { name: 'Cavalo', file: 'cavalo.jpg' },
      { name: 'Cavalo-marinho', file: 'cavalosmarinho.jpg' },
      { name: 'Cobra', file: 'cobra.jpg' },
      { name: 'Coelho', file: 'coelho.jpg' },
      { name: 'Elefante', file: 'elefante.jpg' },
      { name: 'Formiga', file: 'formiga.jpg' },
      { name: 'Gaivota', file: 'gaivota.jpg' },
      { name: 'Galinha', file: 'galinha.jpg' },
      { name: 'Galo', file: 'galo.jpg' },
      { name: 'Gato', file: 'gato.jpg' },
      { name: 'Girafa', file: 'girafa.jpg' },
      { name: 'Golfinho', file: 'golfinho.jpg' },
      { name: 'Gorila', file: 'gorila.jpg' },
      { name: 'Hipopótamo', file: 'hipopotamo.jpg' },
      { name: 'Jacaré', file: 'jacare.jpg' },
      { name: 'Joaninha', file: 'joaninha.jpg' },
      { name: 'Leão', file: 'leao.jpg' },
      { name: 'Lula', file: 'lula.jpg' },
      { name: 'Macaco', file: 'macaco.jpg' },
      { name: 'Ovelha', file: 'ovelha.jpg' },
      { name: 'Papagaio', file: 'papagaio.jpg' },
      { name: 'Pato', file: 'pato.jpg' },
      { name: 'Pintinho', file: 'pintinho.jpg' },
      { name: 'Polvo', file: 'polvo.jpg' },
      { name: 'Pombo', file: 'pombo.jpg' },
      { name: 'Porco', file: 'porco.jpg' },
      { name: 'Raposa', file: 'raposa.jpg' },
      { name: 'Rato', file: 'rato.jpg' },
      { name: 'Rinoceronte', file: 'rinoceronte.jpg' },
      { name: 'Sapo', file: 'sapo.jpg' },
      { name: 'Tartaruga', file: 'tartaruga.jpg' },
      { name: 'Tigre', file: 'tigre.jpg' },
      { name: 'Tubarão', file: 'tubarao.jpg' },
      { name: 'Urso', file: 'urso.jpg' },
      { name: 'Vaca', file: 'vaca.jpg' },
      { name: 'Zebra', file: 'zebra.jpg' }
    ];
    let currentIndex = 0;
    let isTransitioning = false;
    
    const cardImg = document.getElementById('card-img');
    const cardName = document.getElementById('card-name');
    const speakBtn = document.getElementById('speak-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function preloadAllImages() {
      let loadedCount = 0;
      const total = items.length;

      function checkFinished() {
        loadedCount++;
        if (loadedCount === total) {
          const screen = document.getElementById('loading-screen');
          if (screen) {
            screen.style.opacity = '0';
            setTimeout(() => screen.remove(), 400);
          }
          renderCard(currentIndex);
        }
      }

      items.forEach(item => {
        const img = new Image();
        img.src = `imagens/${item.file}`;
        img.onload = checkFinished;
        img.onerror = checkFinished; // Garante que se faltar alguma imagem, o app abre mesmo assim
      });
    }

    function playPopSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function speakName(name) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(name);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderCard(index) {
      const item = items[index];
      cardImg.src = `imagens/${item.file}`;
      cardName.textContent = item.name;
    }

    function proximoAnimal() {
      if (isTransitioning) return;
      if (currentIndex < items.length - 1) {
        isTransitioning = true;
        currentIndex++;
        // Som de navegação removido para frente
        renderCard(currentIndex);
        setTimeout(() => { isTransitioning = false; }, 150);
      }
    }

    function animalAnterior() {
      if (isTransitioning) return;
      if (currentIndex > 0) {
        isTransitioning = true;
        currentIndex--;
        // Som de navegação também removido para trás para manter a navegação silenciosa
        renderCard(currentIndex);
        setTimeout(() => { isTransitioning = false; }, 150);
      }
    }

    nextBtn.addEventListener('click', proximoAnimal);
    prevBtn.addEventListener('click', animalAnterior);

    speakBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      playPopSound(); // Mantém o som apenas ao clicar no botão de falar o nome do animal
      speakName(items[currentIndex].name);
    });

    document.getElementById('fs-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    preloadAllImages();
  </script>
</body>
</html>
